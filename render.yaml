# Deploy frontend with true Node SSR (Express server.js).
# Dashboard alternative: Web Service → Root Directory: frontend
#   Build:  npm install && npm run build:ssr
#   Start:  npm run start:ssr
services:
  - type: web
    name: taaja-news-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build:ssr
    startCommand: npm run start:ssr
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SSR_API_BASE_URL
        value: https://taajanews-api.onrender.com/api
      - key: VITE_API_BASE_URL
        value: https://taajanews-api.onrender.com/api
      - key: VITE_SITE_URL
        sync: false
