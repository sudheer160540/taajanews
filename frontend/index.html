<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4875BC" />
    <meta name="author" content="Taaja News" />
    <meta name="application-name" content="Taaja News" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are
         injected here per-route: by the SSR server (crawlers) and by
         react-helmet-async on the client (Seo.jsx). A default title is set by
         MainLayout's <Seo>; page-level <Seo> overrides it. -->
    <!--ssr-head-->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-state-->
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
